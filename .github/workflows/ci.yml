name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  uji:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Versi pnpm dibaca dari field "packageManager" di package.json supaya
      # CI dan lokal identik (overrides di pnpm-workspace.yaml, lihat #18).
      # Jangan isi `version:` di sini — action-setup menolak bila keduanya ada
      # dan berbeda. pnpm 12 butuh action-setup >= v6.1.0.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

  periksa:
    name: gerbang rilis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # Satu skrip yang sama dengan `pnpm periksa` di laptop: tsc + ESLint
      # (keduanya memblokir), build produksi, pola berbahaya di sumber, rahasia
      # di bundel peramban, test gerbang /admin, dan audit dependensi produksi.
      - name: Gerbang rilis
        run: bash tools/periksa.sh
